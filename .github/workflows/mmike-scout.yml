name: "mm!ke Scout"

# The scout runs independently, scanning feeds and searching the web
# for stories. It deposits research briefs into the story queue.
# Runs every 3 hours. Does not write articles or create PRs.

on:
  schedule:
    # Every 3 hours: midnight, 3am, 6am, 9am, noon, 3pm, 6pm, 9pm UTC
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual scout run'

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install @anthropic-ai/sdk
          npm install

      - name: Configure Git identity
        run: |
          git config user.name "mm!ke"
          git config user.email "mmike@lawpeeps.ai"

      - name: Run scout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node agents/scout.mjs

      - name: Commit queue and memory updates
        run: |
          git add agents/memory/ agents/sources.json || true
          git diff --cached --quiet || git commit -m "scout: queue and memory update $(date -u +%Y-%m-%dT%H:%M)"
          git push origin main || true

      - name: Upload scout artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-${{ github.run_number }}
          path: |
            agents/memory/latest-digest.json
            agents/memory/latest-discovery.json
            agents/memory/story-queue.json
          retention-days: 7
