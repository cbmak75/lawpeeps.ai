name: "mm!ke Scout"

# Pipeline v3: monitor fetches feeds and writes a digest; triage runs
# a deterministic pre-filter (with topic-fingerprint dedupe) and a
# cheap Haiku batch pass, then enqueues surviving stories. Only the
# editorial workflow, running on a separate cron, picks up from the
# queue and writes articles.
#
# Runs every 3 hours.

on:
  schedule:
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual scout run'
      tier:
        description: 'Source tier filter (A, B, or blank for all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install @anthropic-ai/sdk
          npm install

      - name: Configure Git identity
        run: |
          git config user.name "mm!ke"
          git config user.email "mmike@lawpeeps.ai"

      - name: Run monitor (fetch feeds, write digest)
        run: node agents/monitor.mjs

      - name: Run triage (pre-filter + Haiku + enqueue)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TIER="${{ github.event.inputs.tier }}"
          if [ -n "$TIER" ]; then
            node agents/triage.mjs --tier "$TIER"
          else
            node agents/triage.mjs
          fi

      - name: Commit queue and memory updates
        run: |
          git add agents/memory/ || true
          git diff --cached --quiet || git commit -m "scout: queue and memory update $(date -u +%Y-%m-%dT%H:%M)"
          git push origin main || true

      - name: Upload scout artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-${{ github.run_number }}
          path: |
            agents/memory/latest-digest.json
            agents/memory/story-queue.json
          retention-days: 7
