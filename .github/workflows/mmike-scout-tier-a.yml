name: "mm!ke Scout Tier A"

# Tier A scout: primary signal feeds polled hourly.
# Uses the deterministic monitor plus at most one free-tier Gemini triage
# call per cycle (skipped entirely when there is nothing new to triage).
# Tier B runs on a slower schedule in mmike-scout.yml.

on:
  schedule:
    # Hourly. The triage-once gate means most runs make no API call,
    # so frequency now costs Actions minutes, not tokens.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual tier A scout run'

permissions:
  contents: write

# Prevent overlapping runs if a cycle is slow
concurrency:
  group: mmike-scout-tier-a
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install

      - name: Configure Git identity
        run: |
          git config user.name "mm!ke"
          git config user.email "mmike@lawpeeps.ai"

      - name: Run scout (tier A)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONITOR_TIER: A
        run: node agents/scout.mjs --tier A

      - name: Commit queue and memory updates
        run: |
          git add agents/memory/ agents/sources.json || true
          git diff --cached --quiet || git commit -m "scout A: queue update $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main || true
          git push origin main || true

      - name: Upload scout artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-tier-a-${{ github.run_number }}
          path: |
            agents/memory/latest-digest.json
            agents/memory/story-queue.json
          retention-days: 3
