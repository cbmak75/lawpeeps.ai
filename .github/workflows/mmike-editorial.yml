name: "mm!ke Editorial Cycle"

# mm!ke runs every 2 hours during UK daytime (7am-10pm BST/GMT).
# He picks the best story from the queue, writes it, sends it to
# the verifier, and stages a PR. One story per cycle.
#
# UK timezone: BST (UTC+1) Mar-Oct, GMT (UTC+0) Nov-Feb.
# To cover 7am-10pm BST, we run 6am-9pm UTC (safe for both).
# That is: 06, 08, 10, 12, 14, 16, 18, 20 UTC.

on:
  schedule:
    - cron: '0 6,8,10,12,14,16,18,20 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Operator-initiated cycle'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  editorial-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install @anthropic-ai/sdk sharp
          npm install

      - name: Configure Git identity
        run: |
          git config user.name "mm!ke"
          git config user.email "mmike@lawpeeps.ai"

      - name: Run editorial cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node agents/editor.mjs

      - name: Upload cycle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-cycle-${{ github.run_number }}
          path: |
            agents/memory/story-queue.json
            agents/memory/editorial-log.json
          retention-days: 30
