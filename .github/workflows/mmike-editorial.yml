name: "mm!ke Editorial Cycle"

# mm!ke runs once a day. He picks the best story from the queue,
# writes it, sends it to the verifier, and stages a PR.
#
# UK timezone: BST (UTC+1) Mar-Oct, GMT (UTC+0) Nov-Feb.
# 08 UTC lands at roughly 9am BST.
# v4: reduced from 3x/day to 1x/day and moved to the Gemini free tier.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Operator-initiated cycle'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  editorial-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Configure Git identity
        run: |
          git config user.name "mm!ke"
          git config user.email "mmike@lawpeeps.ai"

      - name: Run editorial cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node agents/editor.mjs

      - name: Upload cycle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-cycle-${{ github.run_number }}
          path: |
            agents/memory/story-queue.json
            agents/memory/editorial-log.json
          retention-days: 30
