name: mm!ke Editorial Cycle

on:
  schedule:
    # Run every 6 hours: midnight, 6am, noon, 6pm UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Operator-initiated cycle'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  editorial-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install @anthropic-ai/sdk
          npm install

      - name: Configure Git identity
        run: |
          git config user.name "mm!ke"
          git config user.email "mmike@lawpeeps.ai"

      - name: Run editorial cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NETLIFY_FORMS_TOKEN: ${{ secrets.NETLIFY_FORMS_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: node agents/editor.mjs

      - name: Upload cycle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-cycle-${{ github.run_number }}
          path: |
            agents/memory/latest-digest.json
            agents/memory/latest-discovery.json
            agents/memory/latest-research.json
          retention-days: 30
