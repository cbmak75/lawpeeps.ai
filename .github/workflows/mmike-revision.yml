name: "mm!ke revision"

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  NODE_VERSION: "22"

jobs:
  # ─── Reject: operator kills the story ─────────────────────────────
  reject:
    name: "mm!ke rejection"
    runs-on: ubuntu-latest
    if: |
      startsWith(github.event.pull_request.head.ref, 'mmike/') &&
      github.event.review.state == 'CHANGES_REQUESTED' &&
      (
        contains(github.event.review.body, 'KILL') ||
        contains(github.event.review.body, 'REJECT') ||
        contains(github.event.review.body, 'kill') ||
        contains(github.event.review.body, 'reject')
      )

    steps:
      - name: Close PR and comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          REVIEW_BODY="${{ github.event.review.body }}"

          # Post a comment explaining the rejection
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "## mm!ke: story rejected

          The operator has killed this story. Closing without merge.

          *Operator's note: ${REVIEW_BODY}*

          *-- mm!ke*"

          # Close the PR
          gh pr close "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --delete-branch

          echo "::notice::PR #${PR_NUMBER} rejected and closed by operator."

  # ─── Revise: operator requests changes ─────────────────────────────
  revision:
    name: "mm!ke revision cycle"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only run if:
    # 1. The PR branch starts with "mmike/" (mm!ke's editorial branches)
    # 2. The review action is "changes_requested"
    # 3. The review does NOT contain KILL or REJECT
    if: |
      startsWith(github.event.pull_request.head.ref, 'mmike/') &&
      github.event.review.state == 'CHANGES_REQUESTED' &&
      !contains(github.event.review.body, 'KILL') &&
      !contains(github.event.review.body, 'REJECT') &&
      !contains(github.event.review.body, 'kill') &&
      !contains(github.event.review.body, 'reject')

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run revision agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node agents/revise.mjs

      - name: Commit and push revisions
        run: |
          if git status --porcelain | grep -q "src/content/articles/"; then
            git config user.name "mm!ke"
            git config user.email "mmike@lawpeeps.ai"
            git add src/content/articles/
            git commit -m "revise: operator feedback applied"
            git push origin ${{ github.event.pull_request.head.ref }}
            echo "::notice::Article revisions committed and pushed"
          else
            echo "::notice::No article changes to commit"
          fi
