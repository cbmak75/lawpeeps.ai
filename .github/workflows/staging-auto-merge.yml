name: Staging Auto-Merge

# Checks open mm!ke PRs and auto-merges based on staging level:
#   GREEN  -> merge after 2-hour hold
#   AMBER  -> merge after 24-hour hold (with disclosure)
#   RED    -> never auto-merge, report only
#
# PRs are identified by title pattern: [GREEN], [AMBER], [RED]
# Operator can close any PR manually to reject it.

on:
  schedule:
    # Run every hour at :30
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "mm!ke"
          git config user.email "mmike@lawpeeps.ai"

      - name: Process GREEN PRs (2-hour hold)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking GREEN PRs..."

          # Find open PRs with [GREEN] in the title
          gh pr list --state open --json number,title,createdAt --jq '.[] | select(.title | test("^\\[GREEN\\]")) | @json' | while read -r pr_json; do
            PR_NUM=$(echo "$pr_json" | jq -r '.number')
            PR_TITLE=$(echo "$pr_json" | jq -r '.title')
            CREATED=$(echo "$pr_json" | jq -r '.createdAt')

            echo "Found GREEN PR #$PR_NUM: $PR_TITLE"

            # Calculate age in seconds
            CREATED_EPOCH=$(date -d "$CREATED" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$CREATED" +%s 2>/dev/null)
            NOW_EPOCH=$(date +%s)
            AGE_SECONDS=$((NOW_EPOCH - CREATED_EPOCH))
            AGE_HOURS=$((AGE_SECONDS / 3600))

            if [ "$AGE_HOURS" -ge 2 ]; then
              echo "PR #$PR_NUM is ${AGE_HOURS}h old. Auto-merging (GREEN, 2-hour hold expired)."
              gh pr merge "$PR_NUM" --merge --body "Auto-merged: GREEN staging, 2-hour hold window expired without operator intervention."
            else
              echo "PR #$PR_NUM is ${AGE_HOURS}h old. Hold window not yet expired."
            fi
          done

      - name: Process AMBER PRs (24-hour hold)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking AMBER PRs..."

          gh pr list --state open --json number,title,createdAt --jq '.[] | select(.title | test("^\\[AMBER\\]")) | @json' | while read -r pr_json; do
            PR_NUM=$(echo "$pr_json" | jq -r '.number')
            PR_TITLE=$(echo "$pr_json" | jq -r '.title')
            CREATED=$(echo "$pr_json" | jq -r '.createdAt')

            echo "Found AMBER PR #$PR_NUM: $PR_TITLE"

            # Calculate age
            CREATED_EPOCH=$(date -d "$CREATED" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$CREATED" +%s 2>/dev/null)
            NOW_EPOCH=$(date +%s)
            AGE_SECONDS=$((NOW_EPOCH - CREATED_EPOCH))
            AGE_HOURS=$((AGE_SECONDS / 3600))

            if [ "$AGE_HOURS" -ge 24 ]; then
              echo "PR #$PR_NUM is ${AGE_HOURS}h old. Auto-merging with disclosure (AMBER, 24-hour hold expired)."
              gh pr comment "$PR_NUM" --body "**Disclosure**: This article was auto-published after the 24-hour operator review window expired without intervention. The operator did not review this piece within the review window."
              gh pr merge "$PR_NUM" --merge --body "Auto-merged: AMBER staging, 24-hour hold window expired. Published with disclosure note."
            else
              echo "PR #$PR_NUM is ${AGE_HOURS}h old. Hold window not yet expired."
            fi
          done

      - name: Report RED PRs (no auto-merge)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking RED PRs (report only, no auto-merge)..."

          RED_PRS=$(gh pr list --state open --json number,title --jq '.[] | select(.title | test("^\\[RED\\]")) | "#\(.number): \(.title)"')
          if [ -n "$RED_PRS" ]; then
            echo "WARNING: RED PR(s) awaiting operator review:"
            echo "$RED_PRS"
          else
            echo "No RED PRs pending."
          fi
