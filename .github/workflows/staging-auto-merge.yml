name: Staging Auto-Merge

on:
  schedule:
    # Run every hour at :30 to check for PRs ready to auto-merge
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "mm!ke"
          git config user.email "mmike@lawpeeps.ai"

      - name: Process GREEN PRs (2-hour hold)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking GREEN PRs..."

          # Find open PRs with staging-green label
          gh pr list --label "staging-green" --state open --json number,createdAt,labels --jq '.[]' | while read -r pr_json; do
            PR_NUM=$(echo "$pr_json" | jq -r '.number')
            CREATED=$(echo "$pr_json" | jq -r '.createdAt')

            # Check if PR has a reject label
            HAS_REJECT=$(echo "$pr_json" | jq -r '.labels[] | select(.name == "reject") | .name')
            if [ "$HAS_REJECT" = "reject" ]; then
              echo "PR #$PR_NUM has reject label. Closing."
              gh pr close "$PR_NUM" --comment "Rejected by operator."
              continue
            fi

            # Calculate age in seconds
            CREATED_EPOCH=$(date -d "$CREATED" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$CREATED" +%s 2>/dev/null)
            NOW_EPOCH=$(date +%s)
            AGE_SECONDS=$((NOW_EPOCH - CREATED_EPOCH))
            AGE_HOURS=$((AGE_SECONDS / 3600))

            if [ "$AGE_HOURS" -ge 2 ]; then
              echo "PR #$PR_NUM is ${AGE_HOURS}h old. Auto-merging (GREEN, 2-hour hold expired)."
              gh pr merge "$PR_NUM" --merge --body "Auto-merged: GREEN staging, 2-hour hold window expired without operator intervention."
            else
              echo "PR #$PR_NUM is ${AGE_HOURS}h old. Hold window not yet expired."
            fi
          done

      - name: Process AMBER PRs (24-hour hold)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking AMBER PRs..."

          gh pr list --label "staging-amber" --state open --json number,createdAt,labels --jq '.[]' | while read -r pr_json; do
            PR_NUM=$(echo "$pr_json" | jq -r '.number')
            CREATED=$(echo "$pr_json" | jq -r '.createdAt')

            # Check for reject or approved labels
            HAS_REJECT=$(echo "$pr_json" | jq -r '.labels[] | select(.name == "reject") | .name')
            HAS_APPROVED=$(echo "$pr_json" | jq -r '.labels[] | select(.name == "approved") | .name')

            if [ "$HAS_REJECT" = "reject" ]; then
              echo "PR #$PR_NUM has reject label. Closing."
              gh pr close "$PR_NUM" --comment "Rejected by operator."
              continue
            fi

            if [ "$HAS_APPROVED" = "approved" ]; then
              echo "PR #$PR_NUM explicitly approved. Merging."
              gh pr merge "$PR_NUM" --merge --body "Merged: AMBER staging, explicitly approved by operator."
              continue
            fi

            # Calculate age
            CREATED_EPOCH=$(date -d "$CREATED" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$CREATED" +%s 2>/dev/null)
            NOW_EPOCH=$(date +%s)
            AGE_SECONDS=$((NOW_EPOCH - CREATED_EPOCH))
            AGE_HOURS=$((AGE_SECONDS / 3600))

            if [ "$AGE_HOURS" -ge 24 ]; then
              echo "PR #$PR_NUM is ${AGE_HOURS}h old. Auto-merging with disclosure (AMBER, 24-hour hold expired)."
              gh pr comment "$PR_NUM" --body "**Disclosure**: This article was auto-published after the 24-hour operator review window expired without intervention. The operator did not review this piece within the review window."
              gh pr merge "$PR_NUM" --merge --body "Auto-merged: AMBER staging, 24-hour hold window expired. Published with disclosure note."
            else
              echo "PR #$PR_NUM is ${AGE_HOURS}h old. Hold window not yet expired."
            fi
          done

      - name: Report RED PRs (no auto-merge)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking RED PRs (report only, no auto-merge)..."

          RED_COUNT=$(gh pr list --label "staging-red" --state open --json number --jq 'length')
          if [ "$RED_COUNT" -gt 0 ]; then
            echo "WARNING: $RED_COUNT RED PR(s) awaiting operator review:"
            gh pr list --label "staging-red" --state open --json number,title --jq '.[] | "#\(.number): \(.title)"'
          else
            echo "No RED PRs pending."
          fi
